name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate routes
        run: npm run gen:routes

      - name: Verify generated routes are committed
        run: git diff --exit-code

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Check module structure
        run: npm run check:modules

      - name: Build
        run: npm run build
